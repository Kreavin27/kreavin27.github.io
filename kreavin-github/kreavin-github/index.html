<style>
:root{--card:#0c0a0d;--line:rgba(255,255,255,.14);--tx:#f2edf1;--mu:#9d939d;--pk:#e3b2dc;--gr:#4ade80;--rd:#f87171;--g1:linear-gradient(135deg,#a77ba3,#3f2c3f)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 15% 100%,#2c1b2d,transparent 55%),#09070a;color:var(--tx);font:500 13px/1.45 Montserrat,"Segoe UI",Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#151116;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pk)}
select option{background:#151116}
textarea{resize:vertical;min-height:56px}
label{display:block;font-size:11px;color:var(--mu);margin:9px 0 3px;font-weight:600}
button{cursor:pointer}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;height:calc(100vh - 24px);margin:12px;padding:14px;border-radius:30px;background:linear-gradient(135deg,#5b535a,#2b252a 55%,#3b323a);box-shadow:0 20px 60px rgba(0,0,0,.6)}
aside{background:#080709;border-radius:22px;padding:20px 14px;display:flex;flex-direction:column;overflow:auto}
.logo{font-size:17px;font-weight:700;margin:2px 8px 26px;letter-spacing:.01em}
.logo b{display:inline-grid;place-items:center;width:22px;height:22px;border:2px solid #fff;border-radius:6px;font-size:12px;margin-right:8px}
.nv{display:block;width:100%;background:none;border:0;color:#d6cfd5;padding:12px 14px;border-radius:14px;text-align:left;font-weight:600;margin-bottom:4px}
.nv:hover{background:#17131a}.nv.on{background:var(--g1);color:#fff}
.sp{flex:1}
.stt{margin:10px 6px 0;padding:10px;border:1px solid var(--line);border-radius:14px;font-size:11px;color:var(--mu);cursor:pointer}
.stt i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--rd)}.stt.ok i{background:var(--gr)}
main{overflow:auto;padding:6px 8px 20px 4px;min-width:0}
h1{font-size:28px;margin:0;font-weight:600;letter-spacing:-.02em}
h1 em{color:var(--pk);font-style:normal}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.sub{color:var(--mu);margin:2px 0 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.who{display:flex;align-items:center;gap:10px}
.who small{display:block;color:var(--mu);font-size:11px}
.av{width:40px;height:40px;border-radius:50%;background:var(--g1);display:grid;place-items:center;font-weight:700}
.ib{width:40px;height:40px;border-radius:50%;background:#0a080b;border:1px solid var(--line);color:var(--tx);position:relative}
.ib.al::after{content:"";position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--rd)}
.pl{border:1px solid #e9e3e9;background:rgba(0,0,0,.45);border-radius:99px;padding:9px 18px;color:var(--tx);font-weight:600}
.pl.sm{padding:5px 12px;font-size:12px}
.pl.on{background:var(--g1);border-color:transparent}
.pl.fl{background:#f2edf1;color:#111;border:0}
.bar{display:flex;justify-content:space-between;gap:14px;margin-bottom:14px;align-items:center}
.bar>div{display:flex;gap:8px}
.srch{flex:0 1 330px;background:#0a080b;border:1px solid var(--line);border-radius:99px;padding:0 6px 0 16px;display:flex;align-items:center}
.srch input{border:0;background:none;padding:11px 8px}
.c{background:linear-gradient(160deg,rgba(72,54,72,.55),rgba(11,9,12,.96) 55%);border:1px solid var(--line);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:10px 0 4px}
.dg{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:14px}
.col{display:grid;gap:14px;grid-template-rows:auto 1fr}
.dg2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}
.ai{text-align:center;background:radial-gradient(circle at 50% 120%,rgba(227,178,220,.55),transparent 55%),linear-gradient(#0e0b10,#0b090c);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:12px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--tx)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--mu);font-size:11px}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#111;flex:none}
.r{margin-left:auto;text-align:right;white-space:nowrap}
.gr{color:var(--gr)}.rd{color:var(--rd)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{background:#0b090c;border:1px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;text-align:left;color:var(--tx)}
.mc b{font-size:15px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cg span{font-size:10px;color:var(--mu);font-weight:700;padding:3px 0}
.cg button{border:0;background:none;border-radius:50%;aspect-ratio:1;position:relative;font-weight:600;color:var(--tx);font-size:12px}
.cg button:hover{background:#221b24}
.cg .t{background:var(--g1)}.cg .sl{outline:1.5px solid var(--pk)}
.cg .dot{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--rd)}
.cg .dot.k{background:var(--pk)}
.cg.big2 button{font-size:14px;aspect-ratio:1.3;border-radius:14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nb{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--tx)}
.chartw{position:relative;margin-top:8px}
.chartw svg{width:100%;height:auto;display:block}
.vl{position:absolute;top:0;bottom:30px;border-left:1.5px dashed #fff;opacity:.6;display:none}
.dt{position:absolute;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--pk);box-shadow:0 0 14px var(--pk);display:none}
.tip{position:absolute;top:0;transform:translateX(-50%);background:#1b161d;border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:none;white-space:nowrap;pointer-events:none}
table{width:100%;border-collapse:collapse}
td,th{padding:11px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}
th{color:var(--mu)}
.n{text-align:right;white-space:nowrap}
.st{border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}
.st.ok{background:rgba(74,222,128,.15);color:var(--gr)}.st.no{background:rgba(227,178,220,.18);color:var(--pk)}.st.late{background:rgba(248,113,113,.17);color:var(--rd)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:11px;margin:0 4px 4px 0}
.two{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
.two2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.fc{background:#0c0a0d;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{border:1px dashed var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.r3{display:grid;grid-template-columns:60px 1fr 1.3fr;gap:8px}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.paper{background:#fff;color:#111;border-radius:8px;padding:30px;font-size:12px}
.paper h3{margin:0;font-size:30px;letter-spacing:.08em}
.ph{display:flex;justify-content:space-between;gap:12px;border-bottom:4px solid var(--pc);padding-bottom:12px;margin-bottom:14px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.pq{font-size:10px;color:#777;font-weight:600}
.paper th{background:var(--pc);color:#111;font-size:11px}
.paper td{border-color:#eee}
.tot{margin-left:auto;width:270px}.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .gt{border-top:2px solid #111;font-weight:800;font-size:15px;margin-top:4px;padding-top:6px}
.pre{white-space:pre-wrap}
.chat{background:#0c0a0d;border:1px solid var(--line);border-radius:22px;padding:16px;height:calc(100vh - 300px);min-height:240px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:18px;background:#1b161d;align-self:flex-start}
.m.u{background:var(--g1);align-self:flex-end}
.orb{width:64px;height:64px;border-radius:50%;border:2px solid var(--pk);position:relative;flex:none;display:grid;place-items:center;animation:pulse 3s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px dashed #7e617c;animation:spin 12s linear infinite}
.orb::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--pk);box-shadow:0 0 22px var(--pk)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.05)}}
.bn{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);border-radius:16px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#boot{position:fixed;inset:0;background:#050406;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .8s}
#boot.out{opacity:0;pointer-events:none}
.core{width:150px;height:150px;position:relative}
.core i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--pk);border-top-color:transparent;animation:spin 3s linear infinite}
.core i:nth-child(2){inset:16px;border-color:#a77ba3;border-bottom-color:transparent;animation-duration:2s;animation-direction:reverse}
.core i:nth-child(3){inset:34px;border-color:#fff;border-left-color:transparent;animation-duration:1.4s}
.core b{position:absolute;inset:56px;border-radius:50%;background:var(--pk);box-shadow:0 0 40px var(--pk);animation:pulse 1.4s infinite}
#bt{font-size:12px;min-height:90px;color:#a99fa8;text-align:center;line-height:1.9}
#bt em{color:var(--pk);font-style:normal}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:40}
.modal>div{background:#141015;border:1px solid var(--line);border-radius:24px;padding:22px;width:min(440px,92vw);max-height:90vh;overflow:auto}
#pa{display:none}
@media print{@page{margin:12mm}.app,#boot,.modal{display:none!important}body{background:#fff}#pa{display:block}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.wa{margin-top:8px;border:1px solid var(--line);background:var(--g1);border-radius:14px;padding:9px 13px;font-weight:700;font-size:12px}
.lk{display:inline-block;margin-top:8px;font-weight:700;color:var(--pk)}
.logo img{width:26px;height:26px;vertical-align:-7px;margin-right:9px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:6px}
.kp{border:1px solid var(--line);border-radius:16px;padding:12px;background:rgba(255,255,255,.03)}
.kp small{display:block;color:var(--mu);font-size:11px;margin-bottom:2px}.kp b{font-size:17px}
.bchart{display:flex;align-items:flex-end;gap:8px;height:200px;margin-top:14px;transition:filter .25s}
.bchart.hid{filter:blur(10px);pointer-events:none;user-select:none}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--mu);font-size:11px;padding:0}
.bcol .bw{flex:1;width:100%;display:flex;align-items:flex-end}
.bcol i{width:100%;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,var(--pk),#5b3f58)}
.bcol.on{color:#fff}.bcol.on i{box-shadow:0 0 0 2px #fff}
@media(max-width:900px){.four{grid-template-columns:1fr 1fr}}

body{background:var(--bg)}input,select,textarea{background:var(--inp)}select option{background:var(--inp)}
.app{background:var(--app);grid-template-columns:78px minmax(0,1fr)}
.c{background:var(--cg)}.mc,.fc{background:var(--card0)}.cg button:hover{background:var(--hov)}.tip{background:var(--tipb)}.modal>div{background:var(--modalb)}
.pl{border-color:var(--pbd);background:var(--pbg);position:relative;overflow:hidden;isolation:isolate;transition:color .2s ease,border-color .2s ease,transform .2s ease,filter .2s ease}
.pl::before{content:"";position:absolute;inset:0;background:var(--g1);opacity:0;transition:opacity .22s ease;z-index:-1}
.pl:hover::before{opacity:1}.pl:hover{color:var(--on);border-color:transparent;transform:translateY(-1px)}
.pl.on::before{display:none}.pl.on{color:var(--on)}.pl.on:hover{filter:brightness(1.12)}.pl.fl::before{display:none}.pl.fl:hover{color:#111}
.pl.sm{padding:7px 15px;font-size:13px}
.av,.cg .t,.m.u,.wa{color:var(--on)}.bcol.on{color:var(--tx)}.bcol i{background:linear-gradient(180deg,var(--pk),var(--pk2))}
.row,.mc,.cg button,.bcol{transition:background .2s,transform .2s}.mc:hover,.row:hover{background:var(--hov)}
aside{position:relative;z-index:35;background:var(--side);padding:20px 14px;overflow:visible;transition:background .3s}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;line-height:1.15;font-weight:700;margin:2px 4px 22px;min-height:38px;cursor:pointer}
.lg{width:34px;height:34px;flex:none;background:var(--pk);-webkit-mask:var(--lgm) center/contain no-repeat;mask:var(--lgm) center/contain no-repeat}
.nv{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--nvc);padding:5px 10px 5px 5px;border-radius:99px;text-align:left;font-weight:600;margin-bottom:4px;transition:background .2s,color .2s}
.ni{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .25s,background .2s,color .2s}
.nv:hover{background:var(--hov)}.nv.on{background:var(--g1);color:var(--on)}.nv.ga{color:var(--pk)}
.car{margin-left:auto;transition:transform .2s;display:grid}.nv.op .car{transform:rotate(90deg)}
.sm2{margin:0 0 6px 22px;padding-left:8px;border-left:1px solid var(--line)}.sm2 .nv{padding:3px 10px 3px 3px;font-size:12px}.sm2 .ni{width:30px;height:30px}
.rail .nl,.rail .car,.rail .sm2{display:none}.rail .logo{justify-content:center;margin:2px 0 22px}
.rail aside{padding:20px 12px}.rail .nv{padding:5px;justify-content:center}
.rail .nv.on,.rail .nv.ga{background:none}
.rail .nv.on .ni,.rail .nv.ga .ni{background:var(--g1);color:var(--on);transform:translateX(28px);z-index:1}
.rail .nv.on::before,.rail .nv.ga::before{content:"";position:absolute;right:-22px;top:50%;margin-top:-24px;width:48px;height:48px;border-radius:50%;background:var(--side)}
.rail .stt{font-size:0;padding:10px 0;text-align:center}.rail .stt i{margin:0}
.sbt{position:absolute;right:-13px;top:50%;margin-top:-14px;width:28px;height:28px;border-radius:50%;border:0;background:var(--g1);color:var(--on);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:3}
aside:hover .sbt{opacity:1;pointer-events:auto}
main{transition:filter .25s,opacity .25s}
.dg{grid-template-columns:1fr 1fr 1fr;grid-template-rows:175px 310px}
.g11{grid-area:1/1}.g12{grid-area:1/2}.g13{grid-area:1/3/3/4}.g21{grid-area:2/1}.g22{grid-area:2/2}
.fx{display:flex;flex-direction:column}.sc{overflow:auto;min-height:0;flex:1;padding-right:6px}.sc2{max-height:60vh;overflow:auto;padding-right:6px}
.tk{display:block;width:100%;text-align:left;border:1px solid;border-radius:14px;padding:9px 12px;margin-bottom:8px;color:var(--tx);transition:transform .18s,background .2s}
.tk.todo{background:rgba(248,113,113,.13);border-color:rgba(248,113,113,.4)}.tk.prog{background:rgba(240,207,106,.13);border-color:rgba(240,207,106,.45)}.tk.done{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.4)}
.tk.od{background:rgba(248,113,113,.32);border-color:var(--rd);animation:od 1.4s ease-in-out infinite}
.tk:hover{transform:translateY(-1px)}.tk .tl{display:block;font-size:12px;color:var(--mu)}.tk.od .tl{color:var(--rd);font-weight:700}.tk b{display:block;font-size:14px;margin-top:2px}
@keyframes od{50%{box-shadow:0 0 0 3px rgba(248,113,113,.3)}}
.sl2{font-size:12px;font-weight:700;color:var(--mu);margin:6px 2px}
.addrow{width:100%;border:1px dashed var(--line);background:none;color:var(--mu);border-radius:14px;padding:9px;font-weight:600;transition:background .2s,color .2s}.addrow:hover{background:var(--hov);color:var(--tx)}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
.kc{background:var(--card0);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;max-height:calc(100vh - 300px)}
.bd{border-radius:8px;padding:3px 10px;font-weight:700;font-size:12px}.bd.todo{background:rgba(248,113,113,.3)}.bd.prog{background:rgba(240,207,106,.3)}.bd.done{background:rgba(74,222,128,.3)}
.note{margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:14px;color:var(--mu);font-size:12px}
.mini .mc:last-child:nth-child(odd){grid-column:1/-1}
.pf{position:relative;z-index:41;display:flex;align-items:center;gap:10px;min-height:42px}.pn{font-weight:600;transition:opacity .2s}
.pa,.pb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;border:0;background:var(--g1);color:var(--on)}
.pa{transition:transform .25s,opacity .2s}.pb{position:absolute;right:0;top:0;opacity:0;transform:scale(.2);pointer-events:none;transition:transform .32s cubic-bezier(.3,1.5,.5,1),opacity .2s,filter .2s}
.pb:hover{filter:brightness(1.15)}.b4{background:var(--card0);color:var(--tx);border:1px solid var(--line)}
.pf.open .pa{opacity:0;transform:scale(.3);pointer-events:none}.pf.open .pn{opacity:0}.pf.open .pb{opacity:1;pointer-events:auto}
.pf.open .b4{transform:none}.pf.open .b3{transform:translate(-112px,-14px);transition-delay:.04s}.pf.open .b1{transform:translate(-84px,42px);transition-delay:.08s}.pf.open .b2{transform:translate(0,84px);transition-delay:.12s}
#pfb{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .25s}body.pfo #pfb{opacity:1;pointer-events:auto}
.modal{z-index:60;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.modal>div{position:relative;padding-top:26px}.modal h2{padding-right:36px}
.mx{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--tx);display:grid;place-items:center;transition:background .2s}.mx:hover{background:var(--hov)}
.spw{position:fixed;inset:0;z-index:62;pointer-events:none}.spb{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;transition:opacity .25s}
.spn{position:absolute;top:0;right:0;bottom:0;width:min(520px,94vw);background:var(--modalb);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:56px 34px 30px;overflow:auto}
.spw.open{pointer-events:auto}.spw.open .spb{opacity:1}.spw.open .spn{transform:none}
.spt{font-size:26px;font-weight:700;border:0;background:none;padding:0;margin-bottom:14px}.prop{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:10px;padding:8px 0;color:var(--mu)}.prop b{color:var(--tx)}
aside{width:78px;justify-self:start;transition:width .28s ease,box-shadow .28s}aside.open{width:230px;box-shadow:0 24px 70px rgba(0,0,0,.55)}.nl{white-space:nowrap}
#sbb{position:fixed;inset:0;z-index:34;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .25s}body.sbo #sbb{opacity:1;pointer-events:auto}
#lk{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.lkb{display:grid;place-items:center;height:100%}
.lkc{position:relative;background:var(--modalb);border:1px solid var(--line);border-radius:24px;padding:28px;width:min(460px,92vw)}.lkc h2{padding-right:40px}.mx:disabled:hover{background:none}

body.sbo .pf{filter:blur(6px);pointer-events:none}
.chartw.hid{filter:blur(10px);pointer-events:none;user-select:none}
.c:has(table){overflow-x:auto}
#mb{display:none;position:fixed;left:18px;top:18px;z-index:36;width:50px;height:50px;border-radius:50%;border:0;background:var(--g1);color:var(--on);place-items:center;transition:opacity .2s}
body.sbo #mb{opacity:0;pointer-events:none}
@media print{#mb,#sbb,#pfb,#lk,.spw,.pf{display:none!important}}
/* ---- responsif ---- */
@media(max-width:1280px){.hd{padding:6px 200px 0}.dg{grid-template-columns:1fr 1fr;grid-template-rows:auto}
 .g11{grid-area:1/1;min-height:175px}.g12{grid-area:1/2;height:260px}.g21{grid-area:2/1;height:320px}.g22{grid-area:2/2;height:320px}.g13{grid-area:3/1/4/3}
 .dg2{grid-template-columns:1fr}.two2{grid-template-columns:1fr}.kb{grid-template-columns:1fr 1fr}.kb .kc:last-child{grid-column:1/-1}}
@media(max-width:900px){.pn{display:none}.hd{padding:6px 76px 0}.two{grid-template-columns:1fr}.kb{grid-template-columns:1fr}.kc{max-height:none}.four{grid-template-columns:1fr 1fr}h1{font-size:24px}.hd .sub{font-size:12px}}
@media(max-width:760px){
 .app{grid-template-columns:1fr;margin:6px;padding:8px;height:calc(100dvh - 12px);border-radius:22px}
 aside{position:fixed;left:12px;top:12px;bottom:12px;width:250px;transform:translateX(-135%);z-index:50;overflow-y:auto}
 aside.open{transform:none}.sbt{display:none}#mb{display:grid}
 main{padding:68px 2px 20px}.hd{padding:0 62px}
 .pf{top:18px;right:18px}.pa,.pb{width:48px;height:48px;font-size:17px}
 .pf.open .b3{transform:translate(-132px,-6px)}.pf.open .b1{transform:translate(-100px,56px)}.pf.open .b2{transform:translate(0,112px)}
 .dg{grid-template-columns:1fr}.dg>.c{grid-area:auto}.g12,.g21,.g22{height:300px}.g11{min-height:150px}
 .four{grid-template-columns:1fr}.mini{grid-template-columns:1fr 1fr}.bar>div .pl{padding:8px 14px}
 .top{flex-wrap:wrap}.spn{padding:56px 20px 24px}.paper,.pp2{padding-left:18px;padding-right:18px}
 .pp2 .inf{flex-direction:column}.pp2 .inf .r{text-align:left}.pp2 .ft{grid-template-columns:1fr}.pp2 .ln{gap:8px;grid-template-columns:1fr auto}.pp2 .ln span:nth-child(2){display:none}
 .modal>div,.lkc{width:94vw}.kb .kc:last-child{grid-column:auto}
}
@media(max-width:420px){h1{font-size:21px}.mini{grid-template-columns:1fr}.pf.open .b3{transform:translate(-112px,-6px)}.pf.open .b1{transform:translate(-84px,56px)}}

.klg{display:inline-block;--h:40px;height:var(--h);width:calc(var(--h)*1.16);background:currentColor;-webkit-mask:var(--lgk) center/contain no-repeat;mask:var(--lgk) center/contain no-repeat;vertical-align:middle}
.pp2 .bn2 .klg{--h:46px;color:var(--ac)}
.pp3 .n,.pp4 .n,.pp5 .n{text-align:right;white-space:nowrap}
.pp3{position:relative;overflow:hidden;background:#07070a;color:#fff;border-radius:10px;font-size:11.5px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.pp3 .wv{height:150px;position:relative;background:radial-gradient(120% 130% at 10% -10%,var(--ac) 0,transparent 55%),radial-gradient(90% 120% at 95% 0,var(--ac2) 0,transparent 55%),#07070a}
.pp3 .wv::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-72px;height:112px;background:#07070a;border-radius:50%/100% 100% 0 0}
.pp3 .in3{padding:0 30px 30px;margin-top:-34px;position:relative}.pp3 .rw{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#bbb}.pp3 .klg{color:#fff}
.pp3 .big3{font-size:56px;font-weight:800;letter-spacing:-.03em;margin:22px 0 18px;line-height:1}
.pp3 .g3{display:grid;grid-template-columns:1.2fr 1.2fr .8fr;gap:16px;color:#d8d8d8;margin-bottom:22px}.pp3 .rt{text-align:right}.pp3 b{color:#fff}
.pp3 .lb{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#8a8a92;margin-bottom:3px}
.pp3 table{width:100%;border-collapse:collapse}.pp3 th{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#8a8a92;text-align:left;padding:8px 0;border-bottom:1px solid #2a2a30}.pp3 td{padding:11px 0;border-bottom:1px solid #1d1d22;color:#eee}
.pp3 .t3{margin:14px 0 0 auto;width:min(270px,100%)}.pp3 .t3 div{display:flex;justify-content:space-between;padding:4px 0;color:#bbb}.pp3 .t3 .gt{color:#fff;font-weight:800;font-size:15px;border-top:1px solid #333;margin-top:6px;padding-top:9px}.pp3 .pm{margin-top:20px;color:#ccc}
.pp4{position:relative;overflow:hidden;container-type:inline-size;background:#ebe8de;color:#111;border-radius:10px;padding:22px 24px 0;font-size:11.5px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.pp4 .b1,.pp4 .b2{position:absolute;right:0;width:16px;background:var(--ac)}.pp4 .b1{top:40px;height:110px}.pp4 .b2{top:190px;height:110px}
.pp4 .tp4{display:grid;grid-template-columns:auto 1fr 1fr;gap:20px;align-items:start;font-size:10px;margin-bottom:26px;padding-right:20px}
.pp4 .md4{display:flex;justify-content:space-between;gap:18px;margin-bottom:22px;padding-right:20px}.pp4 .md4 p{margin:2px 0}
.pp4 .iv4{text-align:right}.pp4 .w4{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1}.pp4 small{font-size:10px}
.pp4 table{width:calc(100% - 20px);border-collapse:collapse}.pp4 th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #111}.pp4 td{padding:7px 0;border-bottom:1px solid #cfcabb}
.pp4 .s4{width:calc(100% - 20px)}.pp4 .s4 div{display:flex;justify-content:space-between;padding:4px 0}.pp4 .s4 .tt{border-top:1px solid #111;border-bottom:1px solid #111;font-weight:900;font-size:16px;margin-top:8px;padding:8px 0}
.pp4 .tm4{color:#555;font-size:10px;margin-top:10px}
.pp4 .bw{font-weight:900;letter-spacing:-.06em;line-height:.9;margin:22px -8px -.1em;white-space:nowrap;font-family:"Arial Black",Montserrat,Impact,sans-serif;text-transform:lowercase}
.pp5{background:#efeadf;color:#111;border-radius:10px;border-top:7px solid var(--ac);padding:24px 26px 30px;font:11px/1.5 "Courier New",ui-monospace,Menlo,monospace;text-transform:uppercase;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.pp5 .tp5{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.pp5 .tp5 span{font-size:13px;letter-spacing:.08em}.pp5 .dt5{margin-bottom:16px}
.pp5 .cl5{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}.pp5 .lb5{font-weight:700;margin-bottom:2px}
.pp5 .bk5{background:#0e0e0e;color:#fff;border-radius:7px;padding:12px 16px;margin-bottom:12px}.pp5 .h5,.pp5 .r5{display:flex;justify-content:space-between;gap:14px;padding:6px 0}.pp5 .h5{border-bottom:1px dotted #777;font-weight:700;margin-bottom:4px}
.pp5 .gt5{font-weight:700;border-top:1px dotted #777;margin-top:4px;padding-top:8px;display:flex;justify-content:space-between}.pp5 .py5{margin-top:18px;font-size:10px}
@media print{.pp3,.pp4,.pp5{box-shadow:none;border-radius:0}}
@media(max-width:760px){.pp3 .g3{grid-template-columns:1fr}.pp3 .rt{text-align:left}.pp3 .big3{font-size:40px}.pp4 .md4{flex-direction:column}.pp4 .iv4{text-align:left}.pp4 .tp4{grid-template-columns:auto 1fr}.pp5 .cl5{grid-template-columns:1fr}}

.clk{display:flex;align-items:baseline;gap:7px;background:var(--card0);color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:11px 20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:15px;font-variant-numeric:tabular-nums;transition:opacity .2s,background .2s}
.clk small{font-size:11px;color:var(--mu);font-weight:700}.clk:hover{background:var(--hov)}.pf.open .clk{opacity:0;pointer-events:none}
.tzm{display:none;position:absolute;top:calc(100% + 10px);left:0;background:var(--modalb);border:1px solid var(--line);border-radius:18px;padding:6px;min-width:190px;box-shadow:0 16px 40px rgba(0,0,0,.4)}.tzm.open{display:block}
.tzm button{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;background:none;border:0;color:var(--tx);padding:10px 14px;border-radius:12px;transition:background .2s}.tzm button:hover{background:var(--hov)}.tzm button.on{background:var(--g1);color:var(--on)}.tzm small{color:inherit;opacity:.75;font-size:11px}
.quest{margin-bottom:14px}.quest.ok{box-shadow:0 0 0 1px var(--pk),0 0 30px rgba(255,200,120,.18)}
.qb{height:22px;background:var(--tipb);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:14px 0 9px}
.qb i,.pbar i,.xb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pk2),var(--pk));transition:width .5s ease}
.qm{display:flex;justify-content:space-between;font-weight:700}.xb{height:6px;background:var(--tipb);border-radius:99px;overflow:hidden;margin:12px 0 4px}.xb i{background:#ffb24a}
.lv{background:var(--g1);color:var(--on);border-radius:99px;padding:4px 14px;font-weight:700;font-size:12px}
.hg{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;margin-bottom:14px}
.hi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tipb);font-size:17px;flex:none}
.fl{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:#ff8a3d}
